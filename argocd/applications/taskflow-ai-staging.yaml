apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-ai-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saurya96/taskflow-ai-infra.git
    targetRevision: main
    path: kubernetes/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow-ai-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
